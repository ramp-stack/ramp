[package]
name = "ramp2"
version = "1.0.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/ramp-stack/ramp.git"
description = "RAMP is the glue for Maverick OS, Air Servers, And Prisms UI abstraction"
documentation = "https://docs.rs/ramp2"

exclude = ["**/.DS_Store", ".idea/**"]

[features]
demo = []

[dependencies]
include_dir = "0.7.4"
maverick_os = {version = "3.0.0", path = "../maverick_os"}
prism = {package = "prism2", version = "1.0.0", path = "../prism"}
wgpu_prism = {version = "6.0.0", path = "../wgpu_prism"}
air = {version = "3.0.0", path = "../air"}
air_server = {version = "1.0.0", path = "../air_server"}
arc-swap = "1.9.2"
crossfire = "3.1.7"
futures = "0.3"
serde_json = "1"
tokio = {version = "1.53", features = ["sync", "macros"]}
log = "0.4.33"
image = "0.24.9"
serde = {version = "1", features = ["derive", "rc"]}

[[bin]]
name = "ramp2"
path = "src/demo.rs"
required-features = ["demo"]
