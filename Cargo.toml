[package]
name = "ramp2"
version = "1.0.2"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/ramp-stack/ramp.git"
description = "RAMP is the glue for Maverick OS, Air Servers, And Prisms UI abstraction"
documentation = "https://docs.rs/ramp2"

exclude = ["**/.DS_Store", ".idea/**"]

[features]
demo = []

[dependencies]
include_dir = "0.7.4"
maverick_os = "3.0.2"
prism = {package = "prism2", version = "1.0.0"}
wgpu_prism = "6.0.0"
air = "3.0.0"
air_server = "1.0.0"
arc-swap = "1.9.2"
crossfire = "3.1.7"
futures = "0.3"
serde_json = "1"
tokio = {version = "1.53", features = ["sync", "macros"]}
log = "0.4.33"
image = "0.24.9"
serde = {version = "1", features = ["derive", "rc"]}

[[bin]]
name = "ramp2"
path = "src/demo.rs"
required-features = ["demo"]
