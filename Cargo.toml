[package]
name = "ramp2"
version = "3.0.1"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/ramp-stack/ramp.git"
description = "RAMP is the glue for Maverick OS, Air Servers, And Prisms UI abstraction"
documentation = "https://docs.rs/ramp2"

exclude = ["**/.DS_Store", ".idea/**", "/demo/**", "/ios_demo/**", "/.cargo/**"]

[features]
demo = []

[dependencies]
media = {package = "media2", version = "0.1.0", path = "../media"}
include_dir = {version = "0.7.4"}
maverick_os = {version = "5.0.0", path = "../maverick_os"}
prism = {package = "prism2", version = "3.0.1", path = "../prism"}
wgpu_prism = {version = "8.0.0", path = "../wgpu_prism", features = ["renderer"]}
air = {version = "4.0.0", path = "../air"}
air_notifications = {version = "0.2.0", path = "../air_notifications"}
air_server = {version = "2.0.0", path = "../air_server"}
crossfire = "3.1.7"
futures = "0.3"
uuid = "1.16.0"
serde_json = "1"
tokio = {version = "1.53", features = ["sync", "macros", "rt-multi-thread", "time"]}
log = "0.4.33"
serde = {version = "1", features = ["derive", "rc"]}

erased-serde = {version = "0.4"}
postcard = {version = "1.1.3", features = ["alloc"]}

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
raw-window-handle = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-text = "0.3.2"

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = "0.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
ndk-context = "0.1.1"

[patch.crates-io]
air = {path = "../air"}

[[bin]]
name = "ramp2"
path = "src/main.rs"
required-features = ["demo"]
