[package]
name = "ramp2"
version = "2.0.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/ramp-stack/ramp.git"
description = "RAMP is the glue for Maverick OS, Air Servers, And Prisms UI abstraction"
documentation = "https://docs.rs/ramp2"

exclude = ["**/.DS_Store", ".idea/**", "/demo/**", "/ios_demo/**", "/.cargo/**"]

[features]
demo = []

[dependencies]
include_dir = {version = "0.7.4"}
maverick_os = {version = "4.0.0"}
prism = {package = "prism2", version = "2.0.0", path = "../prism"}
wgpu_prism = {version = "7.0.0", path = "../wgpu_prism"}
air = "3.0.1"
air_notifications = "0.1.1"
air_server = "1.0.2"
crossfire = "3.1.7"
futures = "0.3"
serde_json = "1"
tokio = {version = "1.53", features = ["sync", "macros", "rt-multi-thread", "time"]}
log = "0.4.33"
serde = {version = "1", features = ["derive", "rc"]}

erased-serde = {version = "0.4"}
postcard = {version = "1.1.3", features = ["alloc"]}

[[bin]]
name = "ramp2"
path = "src/main.rs"
required-features = ["demo"]
